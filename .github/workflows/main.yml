name: Build Gallery2 (AOSP Style)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-aosp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # استخدام أداة أندرويد الجاهزة لتجنب أخطاء تنزيل sdk.zip
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager "build-tools;30.0.3" "platforms;android-30"

      - name: Build APK using AOSP Utilities
        run: |
          # تحديد مسارات أدوات البناء
          BUILD_TOOLS=$ANDROID_HOME/build-tools/30.0.3
          PLATFORM=$ANDROID_HOME/platforms/android-30/android.jar

          # 1. تجميع الموارد (Resources)
          $BUILD_TOOLS/aapt package -f -m \
            -J src \
            -M AndroidManifest.xml \
            -S res \
            -I $PLATFORM

          # 2. تجميع أكواد Java
          mkdir -p obj/classes
          find src src_pd -name "*.java" 2>/dev/null > sources.txt
          javac -d obj/classes \
            -classpath $PLATFORM \
            -source 1.8 -target 1.8 \
            @sources.txt

          # 3. تحويل الكود إلى Dex (D8 Compiler)
          find obj/classes -name "*.class" > classes.txt
          $BUILD_TOOLS/d8 --lib $PLATFORM \
            --output ./ \
            @classes.txt

          # 4. دمج الـ Dex والموارد داخل APK غير موقع
          $BUILD_TOOLS/aapt package -f \
            -M AndroidManifest.xml \
            -S res \
            -I $PLATFORM \
            -F Gallery2-unsigned.apk

          $BUILD_TOOLS/aapt add Gallery2-unsigned.apk classes.dex

          # 5. محاذاة وتوقيع الـ APK
          $BUILD_TOOLS/zipalign -v 4 Gallery2-unsigned.apk Gallery2-aligned.apk
          
          keytool -genkeypair -validity 10000 -dname "CN=AOSP, OU=Android, O=Google, L=Mountain View, C=US" \
            -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA

          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out Gallery2-aosp-debug.apk Gallery2-aligned.apk

      - name: Upload AOSP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery2-AOSP-APK
          path: Gallery2-aosp-debug.apk
