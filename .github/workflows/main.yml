name: Build Gallery2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. نقل الملفات للمسار الصحيح
      - name: Auto Structuring Folders
        run: |
          mkdir -p app
          [ -d "src" ] && mv src app/ || true
          [ -d "src_pd" ] && mv src_pd app/ || true
          [ -d "res" ] && mv res app/ || true
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/ || true
          [ -f "proguard.flags" ] && mv proguard.flags app/ || true

      # 2. إنشاء gradle.properties وتفعيل AndroidX (حل المشكلة الحالية)
      - name: Enable AndroidX Flags
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      # 3. توليد ملفات Gradle الهيكلية تلقائياً
      - name: Auto Generate Gradle Configuration Files
        run: |
          if [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = 'Gallery2'" > settings.gradle
            echo "include ':app'" >> settings.gradle
            [ -d "gallerycommon" ] && echo "include ':gallerycommon'" >> settings.gradle
          fi

          if [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          fi

          if [ ! -f "app/build.gradle" ]; then
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.android.gallery3d'
              compileSdk 34
              defaultConfig {
                  applicationId "com.android.gallery3d"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.fragment:fragment:1.6.2'
              implementation 'androidx.heifwriter:heifwriter:1.0.0'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          fi

      # 4. إعداد الـ Wrapper وتحديد الصلاحيات
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # 5. تشغيل البناء
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 6. رفع الـ APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery2-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
